[project]
name = "talent-academy-lms-backend"
version = "0.1.0"
description = "Talent Academy LMS API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.35,<1",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.13,<2",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "PyJWT>=2.10,<3",
    "argon2-cffi>=23.1,<24",
    "email-validator>=2.2,<3",
    "python-multipart>=0.0.20,<1",
    "httpx>=0.28,<1",
    "boto3>=1.35,<2",
    "apscheduler>=3.10,<4",
    "openpyxl>=3.1,<4",
    "nh3>=0.2,<1",
    "reportlab>=4.2,<5",
    "arabic-reshaper>=3.0,<4",
    "python-bidi>=0.6,<1",
    "pillow>=10.4,<12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.7,<1",
    "mypy>=1.13,<2",
]

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
